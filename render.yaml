# Render blueprint: the NISAR measurement service (workers/nisar).
# Render → New → Blueprint → pick this repo. Then set EARTHDATA_TOKEN when
# asked, and copy NISAR_WORKER_KEY (generated) and the service URL into the
# Next.js app's environment as NISAR_WORKER_KEY and NISAR_WORKER_URL.
services:
  - type: web
    name: orbit-lens-nisar
    runtime: docker
    dockerContext: .
    dockerfilePath: ./workers/nisar/Dockerfile
    plan: free
    region: singapore
    healthCheckPath: /health
    envVars:
      - key: EARTHDATA_TOKEN
        sync: false
      - key: NISAR_WORKER_KEY
        generateValue: true
